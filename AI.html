<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="page.chatTitle">Ilyos — AI yordamchi</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="./cursor.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
<link rel="stylesheet" href="./main.css">
<style>
  :root {
    --bg-main: #080B14;
    --bg-surface: #101524;
    --bg-surface-2: #171E32;
    --accent-blue: #3B82F6;
    --accent-indigo: #6366F1;
    --accent-purple: #8B5CF6;
    --accent-violet: #A855F7;
    --accent-gradient: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #D946EF 100%);
    --accent-gradient-hover: linear-gradient(135deg, #60A5FA 0%, #A855F7 50%, #F0ABFC 100%);
    --user-msg-bg: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
    --agent-msg-bg: rgba(23, 30, 50, 0.8);
    --agent-msg-border: rgba(139, 92, 246, 0.25);
    --text-primary: #F3F4F6;
    --text-secondary: #9CA3AF;
    --text-muted: #6B7280;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(139, 92, 246, 0.4);
    --shadow-glow: 0 0 25px rgba(139, 92, 246, 0.25);
    --err-bg: rgba(239, 68, 68, 0.12);
    --err-border: rgba(239, 68, 68, 0.3);
    --err-text: #FCA5A5;
    --radius: 18px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  html, body { height: 100%; min-height: 100%; margin: 0; }
  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    flex-direction: row;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.15), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.15), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(217, 70, 239, 0.08), transparent 60%);
    background-attachment: fixed;
  }

  .sidebar {
    width: 260px;
    min-width: 260px;
    background: rgba(16, 21, 36, 0.95);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
    z-index: 100;
    backdrop-filter: blur(16px);
    transition: transform 0.3s ease;
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-surface-2);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    padding: 12px 16px;
    border-radius: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .new-chat-btn:hover {
    background: rgba(139, 92, 246, 0.15);
    border-color: var(--border-glow);
    color: #C084FC;
  }
  .new-chat-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .chat-history {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chat-history-row {
    display: flex;
    align-items: center;
    gap: 4px;
    border-radius: 10px;
  }
  .chat-history-item {
    width: 100%;
    min-width: 0;
    border: 0;
    background: transparent;
    text-align: left;
    font-family: inherit;
  }
  .chat-history-item.active {
    background: rgba(139, 92, 246, 0.15);
    color: var(--text-primary);
  }
  .history-item {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .chat-history-row .chat-history-item {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .delete-chat-btn {
    display: inline-flex;
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    opacity: 0.7;
    transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
  }
  .delete-chat-btn:hover {
    background: var(--err-bg);
    color: var(--err-text);
    opacity: 1;
  }
  .delete-chat-btn:focus-visible {
    outline: 2px solid var(--err-text);
    outline-offset: 2px;
    opacity: 1;
  }
  .delete-chat-btn svg { width: 17px; height: 17px; }
  .history-item:hover {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-primary);
  }

  .sidebar-footer {
    border-top: 1px solid var(--border-subtle);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar-footer .language-select {
    width: 100%;
    min-width: 0;
  }

  .shell {
    max-width: 100%;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 100vh;
    position: relative;
    z-index: 1;
    min-width: 0;
  }

  header {
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border-subtle);
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: rgba(8, 11, 20, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 10;
  }
  .language-select {
    min-width: 112px;
    padding: 9px 12px;
    border: 1px solid var(--border-glow);
    border-radius: 100px;
    background: rgba(16, 21, 36, 0.9);
    color: var(--text-primary);
    font: inherit;
    font-size: .88rem;
    cursor: pointer;
  }
  .language-select option { background: #101524; color: #fff; }

  .menu-toggle {
    display: none;
    width: 44px;
    height: 44px;
    flex: 0 0 44px;
    align-items: center;
    justify-content: center;
    background: rgba(139, 92, 246, 0.12);
    border: 1px solid rgba(168, 85, 247, 0.65);
    color: var(--text-primary);
    cursor: pointer;
    padding: 0;
    border-radius: 14px;
    box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.14), 0 4px 14px rgba(139, 92, 246, 0.18);
    transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  .menu-toggle:hover {
    background: rgba(139, 92, 246, 0.24);
    border-color: rgba(192, 132, 252, 0.7);
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.2);
  }
  .menu-toggle:active { transform: scale(0.95); }
  .menu-toggle:focus-visible { outline: 2px solid #C084FC; outline-offset: 3px; }
  .menu-toggle svg { width: 22px; height: 22px; }
  .menu-toggle svg line {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .menu-toggle[aria-expanded="true"] svg line:first-child { transform: translateY(6px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] svg line:nth-child(2) { opacity: 0; }
  .menu-toggle[aria-expanded="true"] svg line:last-child { transform: translateY(-6px) rotate(-45deg); }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 90;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .sidebar-overlay.active { display: block; }

  .mark {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(139, 92, 246, 0.4);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .mark:hover {
    transform: scale(1.05) rotate(3deg);
    box-shadow: 0 6px 22px rgba(217, 70, 239, 0.5);
  }
  .mark svg { width: 22px; height: 22px; color: #FFFFFF; position: relative; z-index: 1; }

  .headline { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #FFFFFF 0%, #D1D5DB 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .status {
    font-size: 12.5px;
    color: var(--text-secondary);
    display: flex; align-items: center; gap: 7px;
    font-weight: 500;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #38BDF8;
    box-shadow: 0 0 10px #38BDF8, 0 0 0 3px rgba(56, 189, 248, 0.25);
    flex-shrink: 0;
    animation: pulseGlow 2s infinite ease-in-out;
  }
  .dot.off {
    background: var(--text-muted);
    box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.15);
    animation: none;
  }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.25); opacity: 0.8; }
  }

  .back-home {
    margin-left: auto;
    padding: 9px 16px;
    border: 1px solid var(--border-glow);
    background: rgba(139, 92, 246, 0.12);
    color: #C084FC;
    border-radius: 100px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .back-home:hover {
    transform: translateY(-2px);
    background: var(--accent-gradient);
    color: #FFFFFF;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
  }
  .account-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 190px;
    min-width: 0;
    padding: 5px 10px 5px 5px;
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    background: rgba(16, 21, 36, 0.9);
  }
  .account-badge[hidden] { display: none; }
  .account-avatar {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--accent-gradient);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
  }
  .account-avatar[hidden] { display: none; }
  .account-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 600;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .welcome-title {
    margin: 12px 0 20px;
    max-width: 580px;
    margin-inline: auto;
    font-size: clamp(1.75rem, 5.5vw, 2.5rem);
    line-height: 1.18;
    letter-spacing: -0.03em;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    text-align: center;
    background: linear-gradient(135deg, #FFFFFF 0%, #60A5FA 35%, #C084FC 70%, #F472B6 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientShift 6s ease infinite;
    text-shadow: 0 0 30px rgba(139, 92, 246, 0.2);
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .msg {
    width: fit-content;
    max-width: min(85%, 620px);
    align-self: flex-start;
    padding: 14px 18px;
    border-radius: 20px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 0 4px 20px rgba(0,0,0,0.22);
  }
  @keyframes flyInLeft { from { opacity: 0; transform: translateX(-18px) scale(0.97); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes flyInRight { from { opacity: 0; transform: translateX(18px) scale(0.97); } to { opacity: 1; transform: translateX(0) scale(1); } }

  .msg.agent {
    background: var(--agent-msg-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--agent-msg-border);
    border-top-left-radius: 4px;
    color: var(--text-primary); 
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    animation: flyInLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-msg-bg);
    border: 1px solid rgba(139, 92, 246, 0.45);
    color: #FFFFFF;
    border-top-left-radius: 20px;
    border-top-right-radius: 4px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    animation: flyInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    font-weight: 400;
  }
  
  .msg.error {
    background: var(--err-bg);
    border: 1px solid var(--err-border);
    border-top-left-radius: 4px;
    color: var(--err-text);
  }
  .msg .label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 5px;
  }
  .retry-btn {
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #0F172A;
    background: #FCA5A5;
    border: none;
    padding: 7px 14px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .retry-btn:hover { background: #F87171; transform: translateY(-1px); }
  .retry-btn svg { width: 13px; height: 13px; }

  .typing {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 16px 20px;
    background: var(--agent-msg-bg);
    backdrop-filter: blur(14px);
    border: 1px solid var(--agent-msg-border);
    border-radius: 20px;
    border-top-left-radius: 4px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #3B82F6;
    box-shadow: 0 0 8px #3B82F6;
    animation: typingBounce 1.2s infinite ease-in-out;
    display: block;
  }
  .typing i:nth-child(2) { animation-delay: 0.2s; background: #8B5CF6; box-shadow: 0 0 8px #8B5CF6; }
  .typing i:nth-child(3) { animation-delay: 0.4s; background: #EC4899; box-shadow: 0 0 8px #EC4899; }
  @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }

  footer {
    padding: 14px 20px calc(18px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border-subtle);
    background: rgba(8, 11, 20, 0.9);
    backdrop-filter: blur(16px);
  }
  .footer-inner {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  form {
    position: relative;
    isolation: isolate;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: rgba(16, 21, 36, 0.85);
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    padding: 8px 8px 8px 18px;
    transition: all 0.25s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  form:focus-within {
    border-color: #8B5CF6;
    box-shadow: 0 0 25px rgba(139, 92, 246, 0.3), 0 0 0 1px #8B5CF6;
    background: rgba(23, 30, 50, 0.95);
  }
  textarea {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 10px 0;
    max-height: 120px;
  }
  textarea::placeholder { color: var(--text-muted); }
  button.send {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 14px;
    border: none;
    background: var(--accent-gradient);
    color: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  button.send:hover:not(:disabled) {
    background: var(--accent-gradient-hover);
    transform: scale(1.05) translateY(-1px);
    box-shadow: 0 6px 20px rgba(217, 70, 239, 0.5);
  }
  button.send:active { transform: scale(0.94); }
  button.send:disabled { opacity: 0.35; cursor: default; transform: none; box-shadow: none; }
  button.send svg { width: 20px; height: 20px; }

  .disclaimer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding-top: 12px;
    opacity: 0.7;
    font-weight: 400;
  }

  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  main::-webkit-scrollbar-thumb:hover { background: rgba(139,92,246,0.35); }

  @media (prefers-reduced-motion: reduce) {
    .msg, .typing i, .welcome-title, .dot { animation: none !important; }
  }

  @media (max-width: 768px) {
    header {
      padding: 14px 20px;
      gap: 12px;
      z-index: 110;
    }
    .account-badge {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      justify-content: center;
      padding: 3px;
    }
    .account-avatar { width: 30px; height: 30px; flex-basis: 30px; }
    .account-name { display: none; }
    .back-home { padding: 8px 12px; font-size: 12px; }
    main { padding: 24px 20px 14px; }
  }

  @media (max-width: 600px) {
    .menu-toggle { display: flex; }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: min(300px, 86vw);
      min-width: 0;
      height: 100vh;
      height: 100dvh;
      padding: max(80px, calc(env(safe-area-inset-top, 0px) + 68px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
      box-shadow: 18px 0 50px rgba(0, 0, 0, 0.45);
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar.open { transform: translateX(0); }
  }

  @media (max-width: 520px) {
    header {
      display: grid;
      grid-template-columns: 42px 42px minmax(0, 1fr) 38px;
      align-items: center;
      column-gap: 10px;
      row-gap: 8px;
      padding: 10px 16px;
    }
    .sidebar { padding-top: max(108px, calc(env(safe-area-inset-top, 0px) + 96px)); }
    .menu-toggle { grid-column: 1; width: 42px; height: 42px; flex-basis: 42px; border-radius: 13px; }
    .mark { grid-column: 2; width: 42px; height: 42px; border-radius: 13px; }
    .mark svg { width: 18px; height: 18px; }
    .headline { grid-column: 3; overflow: hidden; }
    h1 { font-size: 18px; }
    .status { min-width: 0; font-size: 11px; }
    .status span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-badge { grid-column: 4; }
    .back-home { grid-column: 1 / -1; justify-self: end; margin-left: 0; padding: 7px 12px; }
    .top-links { display: none; }
    main { padding: 18px 16px 12px; gap: 12px; }
    .welcome-title { font-size: 1.6rem; }
    .msg { max-width: 90%; padding: 12px 15px; font-size: 14.5px; }
    footer { padding: 10px 12px calc(14px + env(safe-area-inset-bottom, 0px)); }
    form { padding-left: 14px; }
    textarea { font-size: 14px; }
    button.send { width: 40px; height: 40px; }
    .disclaimer { font-size: 10.5px; padding-top: 8px; }
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

<div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

<aside class="sidebar" id="sidebar">
  <button class="new-chat-btn" id="newChatBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    <span data-i18n="chat.new">Yangi chat</span>
  </button>
  <div class="chat-history"></div>
  <div class="sidebar-footer">
    <div class="history-item" data-i18n="chat.secure">ILYOS AI server orqali xavfsiz ulanadi.</div>
    <select class="language-select" id="languageSelect" aria-label="Til">
      <option value="uz">O‘zbekcha</option>
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </select>
  </div>
</aside>

<div class="shell">
  <header data-aos="fade-down" data-aos-duration="700">
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menyuni ochish" data-i18n-aria-label="chat.menuOpen" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <div class="headline">
      <h1>Ilyos</h1>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText" data-i18n="chat.statusConnecting">Ulanmoqda...</span></div>
    </div>
    <div class="top-links"></div>
    <div class="account-badge" id="accountBadge" hidden aria-label="Google akkaunti">
      <img class="account-avatar" id="accountAvatar" alt="" hidden>
      <span class="account-avatar" id="accountInitials" aria-hidden="true"></span>
      <span class="account-name" id="accountName"></span>
    </div>
    <button type="button" class="back-home" onclick="window.location.href='./home.html'" data-i18n="chat.backHome">Bosh sahifaga qaytish</button>
  </header>

  <main id="chat" data-aos="fade-up">
    <h1 class="welcome-title" data-aos="zoom-in" data-aos-delay="120" data-i18n="chat.welcome">Assalomu alaykum! Ilyos AI eshitadi.</h1>
  </main>

  <footer data-aos="fade-up">
    <div class="footer-inner">
      <form id="form">
        <textarea id="input" placeholder="Xabaringizni yozing..." data-i18n-placeholder="chat.input" rows="1"></textarea>
        <button class="send" type="submit" id="sendBtn" aria-label="Yuborish" data-i18n-aria-label="chat.send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </form>
      <div class="disclaimer" data-i18n="chat.disclaimer">Ilyos AI xatoliklarga yo'l qo'yishi mumkin. Muhim masalalarda tekshirib ko'ring.</div>
    </div>
  </footer>
</div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>AOS.init({ once: true, duration: 700, easing: 'ease-out-cubic' });</script>
<script src="./language.js"></script>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const menuToggle = document.getElementById('menuToggle');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const newChatBtn = document.getElementById('newChatBtn');
  const chatHistory = document.querySelector('.chat-history');
  const accountBadge = document.getElementById('accountBadge');
  const accountName = document.getElementById('accountName');
  const accountInitials = document.getElementById('accountInitials');
  const historyStoragePrefix = 'ilyos_chat_history:';
  let historyStorageKey = `${historyStoragePrefix}guest`;
  const isLocalHost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
  const apiBase = isLocalHost ? `http://${window.location.hostname}:5508` : '';
  let responding = false;
  let ready = false;
  let chats = [];
  let activeChatId = null;
  let conversation = [];
  let storageWarningShown = false;
  let authenticatedAccount = false;
  let remoteSyncEnabled = false;
  let remoteChatsEtag = '';
  let remoteSaveTimer = null;
  let remoteSaveQueue = Promise.resolve();
  let syncWarningShown = false;

  function showAccount(user) {
    accountName.textContent = user.name;
    accountInitials.textContent = user.name.charAt(0).toUpperCase();
    accountBadge.hidden = false;
    accountBadge.setAttribute('aria-label', user.name);
  }

  async function initializeAccount() {
    let cachedUser = null;
    try {
      cachedUser = JSON.parse(localStorage.getItem('ilyosActiveUser') || 'null');
    } catch (error) {
      console.error('Faol akkaunt ma’lumotlarini o‘qib bo‘lmadi:', error);
    }
    if (typeof cachedUser?.email === 'string') {
      historyStorageKey = `${historyStoragePrefix}${encodeURIComponent(cachedUser.email.trim().toLowerCase())}`;
      if (typeof cachedUser.name === 'string' && cachedUser.name.trim()) showAccount(cachedUser);
    }

    try {
      const response = await fetch(`${apiBase}/api/account`, { credentials: 'include' });
      if (response.status === 401) {
        historyStorageKey = `${historyStoragePrefix}guest`;
        accountBadge.hidden = true;
        localStorage.removeItem('ilyosActiveUser');
        return;
      }
      const result = await readJson(response);
      if (!result.user || typeof result.user.email !== 'string' || typeof result.user.name !== 'string') {
        throw new Error('Server returned an invalid account.');
      }
      cachedUser = result.user;
      localStorage.setItem('ilyosActiveUser', JSON.stringify(cachedUser));
      historyStorageKey = `${historyStoragePrefix}${encodeURIComponent(cachedUser.email.trim().toLowerCase())}`;
      showAccount(cachedUser);
      authenticatedAccount = true;
    } catch (error) {
      console.error('Cloud account session could not be loaded:', error);
    }
  }

  function loadChats() {
    try {
      const saved = JSON.parse(localStorage.getItem(historyStorageKey) || '[]');
      if (!Array.isArray(saved)) throw new Error('Chat tarixi formati noto‘g‘ri.');
      return saved.filter(item =>
        item && typeof item.id === 'string' && Number.isFinite(item.updatedAt) &&
        (Number.isFinite(item.deletedAt) || (
          typeof item.title === 'string' &&
          Array.isArray(item.messages) &&
          item.messages.every(message =>
            message && ['user', 'model'].includes(message.role) &&
            typeof message.text === 'string'
          )
        ))
      );
    } catch (error) {
      console.error('Chat tarixini o‘qib bo‘lmadi:', error);
      return [];
    }
  }

  function saveChats() {
    chats.sort((first, second) => second.updatedAt - first.updatedAt);
    chats = chats.slice(0, 30);
    try {
      localStorage.setItem(historyStorageKey, JSON.stringify(chats));
    } catch (error) {
      console.error('Chat tarixini saqlab bo‘lmadi:', error);
      if (!storageWarningShown) {
        storageWarningShown = true;
        addAgentMessage(ilyosT('chat.storageError'));
      }
    }
    renderChatHistory();
    scheduleRemoteSave();
  }

  function mergeChatLists(first, second) {
    const merged = new Map();
    [...first, ...second].forEach(item => {
      if (!item || typeof item.id !== 'string') return;
      const previous = merged.get(item.id);
      if (!previous ||
          (Number.isFinite(item.deletedAt) && !Number.isFinite(previous.deletedAt)) ||
          (!Number.isFinite(item.deletedAt) && !Number.isFinite(previous.deletedAt) &&
            (item.updatedAt || 0) > (previous.updatedAt || 0))) {
        merged.set(item.id, item);
      }
    });
    return [...merged.values()]
      .sort((left, right) => (right.updatedAt || 0) - (left.updatedAt || 0))
      .slice(0, 30);
  }

  function reportSyncError(error) {
    console.error('Chat history sync failed:', error);
    if (syncWarningShown) return;
    syncWarningShown = true;
    addAgentMessage(ilyosT('chat.syncError'));
  }

  async function pushRemoteChats(snapshot) {
    let pendingChats = snapshot;
    for (let attempt = 0; attempt < 3; attempt += 1) {
      const response = await fetch(`${apiBase}/api/chats`, {
        method: 'PUT',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'If-Match': remoteChatsEtag
        },
        body: JSON.stringify({ chats: pendingChats })
      });
      if (response.status === 409) {
        const latest = await readJson(await fetch(`${apiBase}/api/chats`, { credentials: 'include' }));
        remoteChatsEtag = latest.etag || '';
        chats = mergeChatLists(chats, latest.chats || []);
        pendingChats = chats;
        localStorage.setItem(historyStorageKey, JSON.stringify(chats));
        continue;
      }
      const result = await readJson(response);
      remoteChatsEtag = result.etag || '';
      syncWarningShown = false;
      return;
    }
    throw new Error('Chat history changed too many times to sync.');
  }

  function scheduleRemoteSave() {
    if (!remoteSyncEnabled) return;
    clearTimeout(remoteSaveTimer);
    const snapshot = JSON.parse(JSON.stringify(chats));
    remoteSaveTimer = setTimeout(() => {
      remoteSaveQueue = remoteSaveQueue
        .then(() => pushRemoteChats(snapshot))
        .catch(reportSyncError);
    }, 350);
  }

  async function initializeChatHistory() {
    await initializeAccount();
    chats = loadChats();
    if (authenticatedAccount) {
      try {
        const response = await fetch(`${apiBase}/api/chats`, { credentials: 'include' });
        const remote = await readJson(response);
        remoteChatsEtag = remote.etag || '';
        remoteSyncEnabled = true;
        chats = mergeChatLists(chats, remote.chats || []);
        localStorage.setItem(historyStorageKey, JSON.stringify(chats));
        scheduleRemoteSave();
      } catch (error) {
        setTimeout(() => reportSyncError(error), 0);
      }
    }
    const newestChat = chats.find(item => !Number.isFinite(item.deletedAt));
    if (newestChat) openChat(newestChat.id);
    else renderChatHistory();
  }

  function renderChatHistory() {
    chatHistory.replaceChildren();
    chats.forEach(savedChat => {
      if (Number.isFinite(savedChat.deletedAt)) return;
      const row = document.createElement('div');
      row.className = 'chat-history-row';
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'history-item chat-history-item';
      item.classList.toggle('active', savedChat.id === activeChatId);
      item.textContent = savedChat.title;
      item.title = savedChat.title;
      item.setAttribute('aria-current', savedChat.id === activeChatId ? 'page' : 'false');
      item.addEventListener('click', () => openChat(savedChat.id));
      row.appendChild(item);

      if (savedChat.id === activeChatId) {
        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'delete-chat-btn';
        deleteButton.setAttribute('aria-label', ilyosT('chat.delete'));
        deleteButton.title = ilyosT('chat.delete');
        deleteButton.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg>';
        deleteButton.addEventListener('click', deleteActiveChat);
        row.appendChild(deleteButton);
      }
      chatHistory.appendChild(row);
    });
  }

  function renderConversation() {
    chat.querySelectorAll('.msg, .typing').forEach(message => message.remove());
    conversation.forEach(message => {
      if (message.role === 'user') addUserMessage(message.text);
      else addAgentMessage(message.text);
    });
  }

  function openChat(chatId) {
    const savedChat = chats.find(item => item.id === chatId);
    if (!savedChat || Number.isFinite(savedChat.deletedAt)) return;
    activeChatId = savedChat.id;
    conversation = savedChat.messages;
    renderConversation();
    renderChatHistory();
    closeSidebar();
  }

  function startNewChat() {
    activeChatId = null;
    conversation = [];
    renderConversation();
    renderChatHistory();
    closeSidebar();
    input.focus();
  }

  function deleteActiveChat() {
    if (!activeChatId) return;
    if (!window.confirm(ilyosT('chat.deleteConfirm'))) return;

    const deletedAt = Date.now();
    chats = chats.map(savedChat => savedChat.id === activeChatId
      ? { id: savedChat.id, title: '', messages: [], updatedAt: deletedAt, deletedAt }
      : savedChat);
    activeChatId = null;
    conversation = [];
    renderConversation();
    saveChats();
    input.focus();
  }

  function getOrCreateActiveChat(firstMessage) {
    let activeChat = chats.find(item => item.id === activeChatId);
    if (activeChat) return activeChat;

    activeChat = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
      title: firstMessage.length > 40 ? `${firstMessage.slice(0, 40).trim()}…` : firstMessage,
      messages: conversation,
      updatedAt: Date.now()
    };
    activeChatId = activeChat.id;
    chats.unshift(activeChat);
    return activeChat;
  }

  newChatBtn.addEventListener('click', startNewChat);

  function toggleSidebar() {
    const isOpen = sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('active', isOpen);
    menuToggle.setAttribute('aria-expanded', String(isOpen));
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('active');
    menuToggle.setAttribute('aria-expanded', 'false');
  }

  menuToggle.addEventListener('click', toggleSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);
  window.addEventListener('ilyoslanguagechange', () => {
    menuToggle.setAttribute('aria-label', sidebar.classList.contains('open') ? ilyosT('chat.menuClose') : ilyosT('chat.menuOpen'));
    setStatus(ready ? ilyosT('chat.statusOnline') : ilyosT('chat.statusConnecting'), ready);
    renderChatHistory();
  });

  function setStatus(text, online) {
    statusText.textContent = text;
    statusDot.classList.toggle('off', !online);
  }

  async function readJson(response) {
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `Server ${response.status}`);
    return data;
  }

  function scrollToEnd() {
    chat.scrollTop = chat.scrollHeight;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function addUserMessage(text) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = '<span class="label">' + escapeHtml(ilyosT('chat.user')) + '</span>' + escapeHtml(text);
    chat.appendChild(el);
    scrollToEnd();
  }

  function addAgentMessage(text) {
    const el = document.createElement('div');
    el.className = 'msg agent';
    el.innerHTML = '<span class="label">Ilyos AI</span>' + escapeHtml(text);
    chat.appendChild(el);
    scrollToEnd();
    return el;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing';
    el.id = 'typingIndicator';
    el.innerHTML = '<i></i><i></i><i></i>';
    chat.appendChild(el);
    scrollToEnd();
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function initGemini() {
    setStatus(ilyosT('chat.statusConnecting'), false);
    try {
      const health = await fetch(`${apiBase}/api/health`).then(readJson);
      if (!health.ready) throw new Error(health.error || ilyosT('chat.serverNotReady'));
      setStatus(ilyosT('chat.statusOnline'), true);
      ready = true;
      sendBtn.disabled = false;
    } catch (e) {
      console.error(e);
      setStatus(ilyosT('chat.statusError'), false);
      const message = e instanceof TypeError
        ? isLocalHost
        ? ilyosT('chat.localError')
        : e.message || ilyosT('chat.networkError')
        : ilyosT('chat.netlifyError');
      addAgentMessage(message);
    }
  }

  async function submitMessage() {
    if (responding || !ready) return;
    const text = input.value.trim();
    if (!text) return;
    
    const activeChat = getOrCreateActiveChat(text);
    activeChat.messages.push({ role: 'user', text });
    activeChat.messages = activeChat.messages.slice(-28);
    conversation = activeChat.messages;
    activeChat.updatedAt = Date.now();
    saveChats();
    addUserMessage(text);
    input.value = '';
    input.style.height = 'auto';
    
    responding = true;
    showTyping();
    sendBtn.disabled = true;

    try {
      const response = await fetch(`${apiBase}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: activeChat.messages,
          language: ilyosLanguage()
        })
      });
      const result = await readJson(response);
      removeTyping();
      if (typeof result.text !== 'string' || !result.text.trim()) {
        throw new Error(ilyosT('chat.emptyResponse'));
      }
      activeChat.messages.push({ role: 'model', text: result.text });
      activeChat.messages = activeChat.messages.slice(-28);
      activeChat.updatedAt = Date.now();
      saveChats();
      if (activeChatId === activeChat.id) {
        conversation = activeChat.messages;
        addAgentMessage(result.text);
      }
    } catch (err) {
      removeTyping();
      console.error(err);
      if (activeChatId === activeChat.id) {
        addAgentMessage(err.message || ilyosT('chat.responseError'));
      }
    } finally {
      responding = false;
      sendBtn.disabled = !ready;
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); submitMessage(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  initializeChatHistory();
  initGemini();
</script>
<script src="./cursor.js"></script>
</body>
</html>
