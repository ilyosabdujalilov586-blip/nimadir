<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.pageTitle">Ilyos | Kirish va Ro'yxatdan o'tish</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="./cursor.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --black: #080B14;
            --panel: #101524;
            --panel-soft: #171E32;
            --line: rgba(139, 92, 246, 0.25);
            --text: #f3f4f6;
            --muted: #94a3b8;
            --purple: #C084FC;
            --purple-strong: #8B5CF6;
        }

        * { box-sizing: border-box; }
        html, body {
            min-height: 100%;
            width: 100%;
        }
        body {
            margin: 0;
            background: #080B14;
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            overflow-x: hidden;
        }

        main, section, .parent { min-height: 100vh; }

        .parent {
            display: grid;
            place-items: center;
            padding: 28px 18px;
            background:
                radial-gradient(circle at 50% 0%, rgba(139, 92, 246, .2), transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(59, 130, 246, .15), transparent 45%),
                #080B14;
        }

        .sing-up {
            position: relative;
            width: min(100%, 430px);
            padding: 38px 32px 34px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(23, 30, 50, .98), rgba(10, 13, 24, .98));
            box-shadow: 0 24px 70px rgba(0, 0, 0, .65);
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .auth-brand img {
            width: 32px;
            height: 32px;
        }

        .auth-brand span {
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -.03em;
        }

        .auth-controls {
            display: flex;
            flex-direction: column;
            margin-bottom: 24px;
        }

        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid var(--line);
        }

        .auth-tab {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 6px;
            cursor: pointer;
            border-radius: 9px;
            line-height: 1.2;
            transition: all 0.2s ease;
        }

        .auth-tab.active {
            background: var(--purple-strong);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .sing-up-title {
            margin: 0 0 20px;
            color: var(--text);
            font-size: clamp(1.5rem, 5vw, 1.9rem);
            font-weight: 800;
            line-height: 1.1;
            text-align: center;
            letter-spacing: -.04em;
            background: linear-gradient(135deg, #FFFFFF 0%, #C084FC 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sing-up form {
            display: none;
            gap: 9px;
        }

        .sing-up form.active-form {
            display: grid;
        }

        .email-title, .password-title, .name-title {
            margin-top: 8px;
            color: var(--muted);
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .email-input, .password-input, .name-input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 13px;
            outline: none;
            padding: 14px 15px;
            background: rgba(255, 255, 255, .035);
            color: var(--text);
            font: inherit;
            font-size: .95rem;
            transition: border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease;
        }

        .email-input:focus, .password-input:focus, .name-input:focus {
            border-color: var(--purple-strong);
            background: rgba(139, 92, 246, .1);
            transform: translateY(-2px);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, .2);
        }

        .sing-up-link {
            display: block;
            width: 100%;
            margin-top: 17px;
            border: 1px solid var(--purple-strong);
            border-radius: 13px;
            padding: 13px 18px;
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #D946EF 100%);
            color: #FFFFFF;
            font-size: .95rem;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
            box-shadow: 0 4px 18px rgba(139, 92, 246, .35);
        }

        .sing-up-link:hover {
            filter: brightness(1.1);
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(139, 92, 246, .45);
        }

        .code-alert {
            width: min(100% - 32px, 390px);
            padding: 32px;
            border: 1px solid rgba(192, 132, 252, .35);
            border-radius: 24px;
            background: linear-gradient(145deg, #171e32, #0a0d18);
            color: var(--text);
            text-align: center;
            box-shadow: 0 28px 90px rgba(0, 0, 0, .65), 0 0 50px rgba(139, 92, 246, .2);
        }

        .code-alert::backdrop {
            background: rgba(3, 5, 12, .78);
            backdrop-filter: blur(8px);
        }

        .code-alert-icon {
            display: grid;
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            place-items: center;
            border: 1px solid rgba(192, 132, 252, .35);
            border-radius: 18px;
            background: rgba(139, 92, 246, .15);
            color: #d8b4fe;
            font-size: 1.6rem;
        }

        .code-alert h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 800;
        }

        .code-alert-message {
            margin: 10px 0 22px;
            color: var(--muted);
            font-size: .9rem;
            line-height: 1.6;
        }

        .code-alert-value {
            margin-bottom: 22px;
            border: 1px solid rgba(192, 132, 252, .25);
            border-radius: 16px;
            padding: 15px;
            background: rgba(139, 92, 246, .09);
            color: #e9d5ff;
            font-size: clamp(2rem, 10vw, 2.6rem);
            font-weight: 800;
            letter-spacing: .32em;
            line-height: 1;
            text-indent: .32em;
            user-select: all;
        }

        .code-alert-dismiss {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 13px 18px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6 55%, #d946ef);
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(139, 92, 246, .3);
            transition: filter .2s ease, transform .2s ease;
        }

        .code-alert-dismiss:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .google-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 18px 0 12px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .google-divider::before, .google-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--line);
        }
        .google-divider::before { margin-right: 10px; }
        .google-divider::after { margin-left: 10px; }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-family: inherit;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .google-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--purple-strong);
            transform: translateY(-2px);
        }
        .google-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .login-error {
            min-height: 20px;
            margin: 14px 0 0;
            color: #ff8f82;
            font-size: .82rem;
            font-weight: 700;
            text-align: center;
            word-break: break-word;
        }
        .login-error.success { color: #4ade80; }
        .login-error.is-visible { animation: errorShake .3s ease; }

        body.connection-pending {
            overflow: hidden;
        }

        .auth-language {
            width: max-content;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 8px 28px 8px 13px;
            background: rgba(16, 21, 36, .96);
            color: var(--text);
            font: inherit;
            font-size: .84rem;
            cursor: pointer;
            align-self: flex-start;
        }

        .auth-language option {
            background: #101524;
            color: #fff;
        }

        .connection-screen {
            position: fixed;
            z-index: 10000;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 45%, rgba(139, 92, 246, .18), transparent 38%),
                #080B14;
            opacity: 1;
            visibility: visible;
            transition: opacity .45s ease, visibility .45s ease;
        }

        .connection-screen.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .connection-screen::before {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            content: "ILYOS.AI";
            color: rgba(192, 132, 252, .08);
            font-size: clamp(4rem, 16vw, 14rem);
            font-weight: 800;
            letter-spacing: .08em;
            white-space: nowrap;
            animation: backgroundBrand 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .connection-content {
            position: relative;
            z-index: 1;
            display: grid;
            justify-items: center;
            gap: 20px;
            padding: 24px;
            text-align: center;
        }

        .connection-spinner {
            position: relative;
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
        }

        .connection-spinner::before {
            position: absolute;
            inset: 0;
            border: 4px solid rgba(192, 132, 252, .2);
            border-top-color: var(--purple);
            border-radius: 50%;
            animation: connectionSpin .9s linear infinite;
            content: "";
        }

        .connection-logo {
            position: relative;
            margin: 0;
            color: #fff;
            font-size: .75rem;
            font-weight: 800;
            letter-spacing: .02em;
            white-space: nowrap;
        }

        .connection-screen.connection-failed .connection-spinner::before {
            animation-play-state: paused;
            opacity: .45;
        }

        .connection-spinner[hidden] {
            display: none;
        }

        .connection-message {
            max-width: 320px;
            margin: 12px 0 0;
            color: #ffb4a9;
            font-size: .95rem;
            font-weight: 700;
        }

        .connection-retry {
            border: 1px solid var(--purple-strong);
            border-radius: 10px;
            padding: 10px 18px;
            background: rgba(139, 92, 246, .18);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .connection-retry:hover {
            background: rgba(139, 92, 246, .32);
        }

        @keyframes connectionSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes backgroundBrand {
            from { transform: translateX(-3%) scale(.96); opacity: .55; }
            to { transform: translateX(3%) scale(1.04); opacity: 1; }
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            30% { transform: translateX(-6px); }
            70% { transform: translateX(6px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .connection-screen::before,
            .connection-spinner::before {
                animation-duration: 3s;
            }
        }

        @media (max-width: 520px) {
            .auth-language {
                width: max-content;
                height: 40px;
                padding: 6px 20px 6px 9px;
                font-size: .72rem;
            }
            .auth-controls {
                gap: 0px;
                margin-bottom: 18px;
            }
            .auth-tabs {
                margin-bottom: 12px;
            }
            .auth-tab {
                padding: 10px 5px;
                font-size: .85rem;
                overflow-wrap: anywhere;
            }
            .parent {
                padding: 16px 12px;
            }
            .sing-up {
                width: min(100%, 100%);
                padding: 26px 18px 22px;
                border-radius: 20px;
            }
            .sing-up-title {
                font-size: 1.5rem;
                margin-bottom: 16px;
            }
            .email-input, .password-input, .name-input {
                padding: 12px 14px;
                font-size: 0.9rem;
            }
            .sing-up-link, .google-btn {
                padding: 12px 14px;
                font-size: 0.9rem;
            }
            .google-btn {
                gap: 8px;
            }
        }

        @media (max-width: 360px) {
            .sing-up {
                padding: 22px 14px 18px;
            }
            .auth-controls {
                gap: 0px;
            }
            .auth-language {
                padding-right: 16px;
                padding-left: 7px;
                font-size: .65rem;
            }
            .auth-tabs {
                padding: 3px;
                margin-bottom: 10px;
            }
            .auth-tab {
                font-size: 0.75rem;
                padding: 8px 6px;
            }
            .sing-up-title {
                font-size: 1.35rem;
            }
            .email-title, .password-title, .name-title {
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

    <div class="connection-screen" id="connectionScreen" role="status" aria-live="polite">
        <div class="connection-content">
            <div class="connection-spinner" id="connectionSpinner" aria-hidden="true">
                <span class="connection-logo">ILYOS.AI</span>
            </div>
            <p class="connection-message" id="connectionMessage" data-i18n="auth.offline" hidden>Internet ishlamadi. Ulanishni tekshirib, qayta urinib ko'ring.</p>
            <button class="connection-retry" id="connectionRetry" type="button" data-i18n="auth.retry" hidden>Qayta tekshirish</button>
        </div>
    </div>

    <main inert aria-hidden="true">
        <section>
            <div class="parent">
                <div class="sing-up">
                    <div class="auth-brand" aria-label="Ilyos AI">
                        <img src="favicon.svg" alt="">
                        <span>ILYOS AI</span>
                    </div>

                    <div class="auth-controls">
                        <div class="auth-tabs" id="authTabsContainer">
                            <button class="auth-tab active" id="tabLogin" data-i18n="auth.loginTab">Kirish</button>
                            <button class="auth-tab" id="tabRegister" data-i18n="auth.registerTab">Ro'yxatdan o'tish</button>
                        </div>
                        <select class="auth-language" id="languageSelect" aria-label="Til">
                            <option value="uz">O‘zbekcha</option>
                            <option value="en">English</option>
                            <option value="ru">Русский</option>
                        </select>
                    </div>

                    <h1 class="sing-up-title" id="formTitle" data-i18n="auth.loginTitle">Tizimga kirish</h1>

                    <!-- Kirish Formasi -->
                    <form id="loginForm" class="active-form">
                        <label class="email-title" for="emailInput" data-i18n="auth.email">Email</label>
                        <input id="emailInput" class="email-input" type="email" placeholder="Email kiriting" data-i18n-placeholder="auth.emailPlaceholder" required>
                    
                        <label class="password-title" for="passwordInput" data-i18n="auth.password">Parol</label>
                        <input id="passwordInput" class="password-input" type="password" placeholder="Parol kiriting" data-i18n-placeholder="auth.passwordPlaceholder" required>
                    
                        <button class="sing-up-link" type="submit" data-i18n="auth.login">Kirish</button>

                        <div class="google-divider" data-i18n="auth.or">yoki</div>
                        <button type="button" class="google-btn" id="googleLoginBtn">
                            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.99 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                            <span data-i18n="auth.googleLogin">Google orqali kirish</span>
                        </button>
                    </form>

                    <!-- Ro'yxatdan o'tish Formasi -->
                    <form id="registerForm">
                        <label class="name-title" for="nameInput" data-i18n="auth.name">Ism</label>
                        <input id="nameInput" class="name-input" type="text" placeholder="Ismingizni kiriting" data-i18n-placeholder="auth.namePlaceholder" required>

                        <label class="email-title" for="regEmailInput" data-i18n="auth.email">Email</label>
                        <input id="regEmailInput" class="email-input" type="email" placeholder="Email kiriting" data-i18n-placeholder="auth.emailPlaceholder" required>

                        <label class="password-title" for="regPasswordInput" data-i18n="auth.password">Parol</label>
                        <input id="regPasswordInput" class="password-input" type="password" minlength="8" placeholder="Yangi parol yarating" data-i18n-placeholder="auth.newPasswordPlaceholder" required>
                    
                        <button class="sing-up-link" type="submit" data-i18n="auth.register">Ro'yxatdan o'tish</button>

                        <div class="google-divider" data-i18n="auth.or">yoki</div>
                        <button type="button" class="google-btn" id="googleRegisterBtn">
                            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.99 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                            <span data-i18n="auth.googleRegister">Google orqali ro'yxatdan o'tish</span>
                        </button>
                    </form>

                    <!-- Kodni tasdiqlash Formasi -->
                    <form id="verifyForm">
                        <label class="name-title" for="verifyCodeInput" data-i18n="auth.verifyCode">Tasdiqlash kodi</label>
                        <p style="font-size: 0.8rem; color: var(--muted); margin: 0 0 8px;" data-i18n="auth.codeInstructions">Alertda ko‘rsatilgan 4 xonali kodni kiriting:</p>
                        <input id="verifyCodeInput" class="name-input" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Kodni kiriting" data-i18n-placeholder="auth.codePlaceholder" maxlength="4" required>
                        <button class="sing-up-link" type="submit" data-i18n="auth.confirmCode">Kodni tasdiqlash</button>
                    </form>

                    <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>

                </div>
            </div>
        </section>
    </main>

    <dialog class="code-alert" id="codeAlert" aria-labelledby="codeAlertTitle" aria-describedby="codeAlertMessage">
        <div class="code-alert-icon" aria-hidden="true">✦</div>
        <h2 id="codeAlertTitle" data-i18n="auth.codeAlertTitle">Tasdiqlash kodi</h2>
        <p class="code-alert-message" id="codeAlertMessage" data-i18n="auth.codeAlertMessage">Ro‘yxatdan o‘tishni yakunlash uchun quyidagi kodni kiriting:</p>
        <div class="code-alert-value" id="codeAlertValue" aria-live="polite"></div>
        <form method="dialog">
            <button class="code-alert-dismiss" type="submit" data-i18n="auth.codeAlertDismiss">Tushunarli</button>
        </form>
    </dialog>

    <script src="./cursor.js"></script>
    <script src="./language.js"></script>
    <script>
        (() => {
            const screen = document.getElementById('connectionScreen');
            const message = document.getElementById('connectionMessage');
            const retryButton = document.getElementById('connectionRetry');
            const spinner = document.getElementById('connectionSpinner');
            const main = document.querySelector('main');
            let timeoutId;
            let isChecking = false;
            let isUnlocked = false;

            document.body.classList.add('connection-pending');

            function showOfflineMessage() {
                screen.classList.add('connection-failed');
                spinner.hidden = true;
                message.hidden = false;
                retryButton.hidden = false;
            }

            async function checkConnection() {
                if (isChecking || isUnlocked || !navigator.onLine) return;
                isChecking = true;
                const controller = new AbortController();
                const requestTimeout = setTimeout(() => controller.abort(), 4000);

                try {
                    await fetch('https://www.gstatic.com/generate_204', {
                        mode: 'no-cors',
                        cache: 'no-store',
                        signal: controller.signal
                    });

                    isUnlocked = true;
                    clearTimeout(timeoutId);
                    main.removeAttribute('inert');
                    main.removeAttribute('aria-hidden');
                    document.body.classList.remove('connection-pending');
                    screen.classList.add('is-hidden');
                    setTimeout(() => screen.remove(), 500);
                } catch {
                    // Keep the page blocked and show the failure message at the 4-second mark.
                } finally {
                    clearTimeout(requestTimeout);
                    isChecking = false;
                }
            }

            function beginCheck() {
                clearTimeout(timeoutId);
                screen.classList.remove('connection-failed');
                message.hidden = true;
                retryButton.hidden = true;
                spinner.hidden = false;
                timeoutId = setTimeout(showOfflineMessage, 4000);
                checkConnection();
            }

            retryButton.addEventListener('click', beginCheck);
            window.addEventListener('online', checkConnection);
            beginCheck();
        })();
    </script>
    <script>
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const verifyForm = document.getElementById('verifyForm');
        const formTitle = document.getElementById('formTitle');
        const loginError = document.getElementById('loginError');
        const authTabsContainer = document.getElementById('authTabsContainer');
        const codeAlert = document.getElementById('codeAlert');
        const codeAlertValue = document.getElementById('codeAlertValue');

        let pendingUserData = null;
        let generatedCode = null;
        let activeAuthMessage = null;
        const isLocalHost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const accountApiBase = isLocalHost ? `http://${window.location.hostname}:5508` : '';

        function updateAuthTitle() {
            const titleKey = verifyForm.classList.contains('active-form')
                ? 'auth.verifyTitle'
                : registerForm.classList.contains('active-form')
                    ? 'auth.registerTitle'
                    : 'auth.loginTitle';
            formTitle.textContent = ilyosT(titleKey);
        }

        function setAuthMessage(key, success = false, values = {}) {
            activeAuthMessage = { key, success, values };
            loginError.textContent = ilyosT(key).replace('{code}', values.code || '');
            loginError.className = `login-error${success ? ' success' : ''} is-visible`;
        }

        function clearAuthMessage() {
            activeAuthMessage = null;
            loginError.textContent = '';
            loginError.className = 'login-error';
        }

        window.addEventListener('ilyoslanguagechange', () => {
            updateAuthTitle();
            if (activeAuthMessage) {
                setAuthMessage(activeAuthMessage.key, activeAuthMessage.success, activeAuthMessage.values);
            }
        });

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.classList.add('active-form');
            registerForm.classList.remove('active-form');
            verifyForm.classList.remove('active-form');
            updateAuthTitle();
            clearAuthMessage();
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerForm.classList.add('active-form');
            loginForm.classList.remove('active-form');
            verifyForm.classList.remove('active-form');
            updateAuthTitle();
            clearAuthMessage();
        });

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function setSignedInUser(user, messageKey = 'auth.loginSuccess') {
            localStorage.setItem('ilyosActiveUser', JSON.stringify(user));
            setAuthMessage(messageKey, true);
            setTimeout(() => {
                window.location.href = './home.html';
            }, 700);
        }

        async function requestAccount(action, data) {
            const requestBody = { action, ...data };
            const requestUrl = `${accountApiBase}/api/account`;
            try {
                const response = await fetch(requestUrl, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    const errorCode = result.error || 'account_request_failed';
                    if (['account_not_found', 'email_exists', 'invalid_account', 'invalid_credentials', 'account_request_failed', 'auth_not_configured', 'google_not_configured', 'invalid_google_credential'].includes(errorCode)) {
                        return fallbackLocalAccountRequest(action, data);
                    }
                    const error = new Error(errorCode);
                    error.code = errorCode;
                    throw error;
                }
                return result.user;
            } catch (error) {
                const errorCode = error?.code || error?.message || 'account_request_failed';
                const shouldFallBack = ['account_not_found', 'email_exists', 'invalid_account', 'invalid_credentials', 'account_request_failed', 'auth_not_configured', 'google_not_configured', 'invalid_google_credential'].includes(errorCode)
                    || String(errorCode).toLowerCase().includes('fetch')
                    || String(errorCode).toLowerCase().includes('network');
                if (shouldFallBack) {
                    return fallbackLocalAccountRequest(action, data);
                }
                throw error;
            }
        }

        function showAccountError(error, fallbackKey = 'auth.cloudUnavailable') {
            const code = error?.code || error?.message || 'account_request_failed';
            if (!['account_request_failed', 'auth_not_configured', 'google_not_configured'].includes(code)) {
                console.error('Account request failed:', error);
            }
            const messageKeys = {
                account_not_found: 'auth.noAccount',
                email_exists: 'auth.duplicateEmail',
                invalid_account: 'auth.invalidAccount',
                invalid_credentials: 'auth.badPassword',
                auth_not_configured: 'auth.cloudUnavailable',
                google_not_configured: 'auth.cloudUnavailable',
                invalid_google_credential: 'auth.googleError'
            };
            setAuthMessage(messageKeys[code] || fallbackKey);
        }

        function readLegacyUsers() {
            const users = JSON.parse(localStorage.getItem('ilyosUsers') || '[]');
            return Array.isArray(users) ? users : [];
        }

        function findLegacyUserByEmail(email) {
            const normalizedEmail = typeof email === 'string' ? email.trim().toLowerCase() : '';
            return readLegacyUsers().find(user =>
                typeof user.email === 'string' &&
                user.email.trim().toLowerCase() === normalizedEmail
            );
        }

        function writeLegacyUsers(users) {
            localStorage.setItem('ilyosUsers', JSON.stringify(Array.isArray(users) ? users : []));
        }

        function fallbackLocalAccountRequest(action, data) {
            const email = typeof data?.email === 'string' ? data.email.trim().toLowerCase() : '';
            const password = typeof data?.password === 'string' ? data.password : '';

            if (action === 'login') {
                const user = findLegacyUserByEmail(email);
                if (!user) {
                    throw Object.assign(new Error('account_not_found'), { code: 'account_not_found' });
                }
                if (user.password !== password || user.password === 'GOOGLE_AUTH_USER') {
                    throw Object.assign(new Error('invalid_credentials'), { code: 'invalid_credentials' });
                }
                return { ...user, email: user.email.trim().toLowerCase() };
            }

            if (action === 'register') {
                const existingUser = findLegacyUserByEmail(email);
                if (existingUser) {
                    throw Object.assign(new Error('email_exists'), { code: 'email_exists' });
                }
                const user = {
                    id: `local-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                    name: (data?.name || 'Foydalanuvchi').trim() || 'Foydalanuvchi',
                    email: email,
                    password
                };
                const users = readLegacyUsers();
                users.push(user);
                writeLegacyUsers(users);
                return user;
            }

            if (action === 'migrate') {
                const existingUser = findLegacyUserByEmail(email);
                if (!existingUser) {
                    const user = {
                        id: `local-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                        name: (data?.name || email.split('@')[0] || 'Foydalanuvchi').trim() || 'Foydalanuvchi',
                        email: email,
                        password
                    };
                    const users = readLegacyUsers();
                    users.push(user);
                    writeLegacyUsers(users);
                    return user;
                }
                existingUser.password = password;
                writeLegacyUsers(readLegacyUsers().map(user =>
                    typeof user.email === 'string' && user.email.trim().toLowerCase() === email ? existingUser : user
                ));
                return { ...existingUser, email: existingUser.email.trim().toLowerCase() };
            }

            throw Object.assign(new Error('auth_not_configured'), { code: 'auth_not_configured' });
        }

        async function signIn(email, password) {
            try {
                const user = await requestAccount('login', { email, password });
                setSignedInUser(user);
            } catch (error) {
                if (error.code !== 'account_not_found') {
                    showAccountError(error);
                    return;
                }

                const legacyUser = findLegacyUserByEmail(email);
                if (!legacyUser) {
                    showAccountError(error);
                    return;
                }
                if (legacyUser.password !== password || legacyUser.password === 'GOOGLE_AUTH_USER') {
                    setAuthMessage('auth.badPassword');
                    return;
                }

                try {
                    const user = await requestAccount('migrate', {
                        name: legacyUser.name,
                        email: legacyUser.email,
                        password
                    });
                    const remainingUsers = readLegacyUsers().filter(item =>
                        typeof item.email === 'string' &&
                        item.email.trim().toLowerCase() !== email.trim().toLowerCase()
                    );
                    writeLegacyUsers(remainingUsers);
                    setSignedInUser(user);
                } catch (migrationError) {
                    showAccountError(migrationError);
                }
            }
        }

        async function signInWithGoogle(credential) {
            try {
                const user = await requestAccount('google', credential);
                setSignedInUser(user);
            } catch (error) {
                showAccountError(error, 'auth.googleError');
            }
        }

        // 1. KIRISH QISMI
        loginForm.addEventListener('submit', async event => {
            event.preventDefault();
            clearAuthMessage();

            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!isValidEmail(email)) {
                setAuthMessage('auth.emailInvalid');
                return;
            }

            await signIn(email, password);
        });

        // 2. RO'YXATDAN O'TISH VA TASDIQLASH KODINI KO'RSATISH
        registerForm.addEventListener('submit', event => {
            event.preventDefault();
            clearAuthMessage();

            const name = document.getElementById('nameInput').value.trim();
            const email = document.getElementById('regEmailInput').value.trim();
            const password = document.getElementById('regPasswordInput').value;

            if (!isValidEmail(email)) {
                setAuthMessage('auth.registerEmailInvalid');
                return;
            }

            if (password.length < 8) {
                setAuthMessage('auth.passwordTooShort');
                return;
            }

            generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
            pendingUserData = { name, email, password };
            codeAlertValue.textContent = generatedCode;
            codeAlert.showModal();

            registerForm.classList.remove('active-form');
            verifyForm.classList.add('active-form');
            authTabsContainer.style.display = 'none';
            updateAuthTitle();
        });

        // 3. KODNI TASDIQLASH VA SAQLASH
        verifyForm.addEventListener('submit', async event => {
            event.preventDefault();
            const enteredCode = document.getElementById('verifyCodeInput').value.trim();

            if (enteredCode === generatedCode) {
                try {
                    const user = await requestAccount('register', pendingUserData);
                    setSignedInUser(user, 'auth.registerSuccess');
                } catch (error) {
                    showAccountError(error);
                }
            } else {
                setAuthMessage('auth.codeInvalid');
            }
        });

        // 4. GOOGLE ORQALI KIRISH
        const googleClientId = '499001615599-oiaag765cv1uc43no0t34p90krs86kt3.apps.googleusercontent.com';

        window.addEventListener('load', () => {
            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: googleClientId,
                    callback: handleGoogleResponse
                });
            }
        });

        function handleGoogleResponse(response) {
            if (typeof response?.credential !== 'string') {
                setAuthMessage('auth.googleError');
                return;
            }
            signInWithGoogle({ idToken: response.credential });
        }

        function triggerGoogleLogin() {
            if (typeof google !== 'undefined' && google.accounts) {
                google.accounts.id.prompt((notification) => {
                    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                        try {
                            const client = google.accounts.oauth2.initTokenClient({
                                client_id: googleClientId,
                                scope: 'email profile',
                                callback: (tokenResponse) => {
                                    if (tokenResponse?.access_token) {
                                        signInWithGoogle({ accessToken: tokenResponse.access_token });
                                    } else {
                                        setAuthMessage('auth.googleError');
                                    }
                                }
                            });
                            client.requestAccessToken();
                        } catch (err) {
                            setAuthMessage('auth.googleOpenError');
                        }
                    }
                });
            } else {
                setAuthMessage('auth.sdkError');
            }
        }

        document.getElementById('googleLoginBtn').addEventListener('click', triggerGoogleLogin);
        document.getElementById('googleRegisterBtn').addEventListener('click', triggerGoogleLogin);
    </script>
</body>
