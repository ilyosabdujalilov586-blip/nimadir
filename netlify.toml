[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/auth/send-code"
  to = "/.netlify/functions/send-code"
  status = 200

[[redirects]]
  from = "/api/auth/verify-code"
  to = "/.netlify/functions/verify-code"
  status = 200
